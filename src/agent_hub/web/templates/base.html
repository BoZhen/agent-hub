<!DOCTYPE html>
<html lang="en" data-theme="graphite">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="{% block viewport %}width=device-width, initial-scale=1, viewport-fit=cover{% endblock %}">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}Agent Hub{% endblock %}</title>
  <script>
    (() => {
      const themes = ['graphite', 'midnight', 'nord', 'tokyo', 'mocha', 'paper', 'solarized', 'one-light', 'rose-dawn', 'latte', 'dracula', 'gruvbox-light'];
      const requested = new URLSearchParams(location.search).get('theme');
      const stored = localStorage.getItem('agentHubTheme');
      document.documentElement.dataset.theme = themes.includes(requested) ? requested : (themes.includes(stored) ? stored : 'graphite');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg?v={{ static_v() }}">
  <link rel="stylesheet" href="/static/hub.css?v={{ static_v() }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-terminal-url="{{ terminal_url or '' }}" data-webfm-url="{{ webfm_url() if webfm_url is defined else '' }}"{% block body_attrs %}{% endblock %}>
  <svg style="display:none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 16v6M7 3h10l-1.5 6.5L19 13H5l3.5-3.5z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-fork" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-12 3-12 7"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></symbol>
    <symbol id="i-contrast" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 12v4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M18.4 6.6a9 9 0 1 1-12.8 0"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L18 10l-4-4L4 16zM13 7l4 4"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/></symbol>
  </svg>
  {% block nav %}
  <nav class="page-nav">
    <a class="btn btn-ghost" href="/"><svg class="icon"><use href="#i-arrow-left"/></svg>Workspace</a>
    <span class="crumb-sep">/</span>
    <h1 class="page-title">{% block page_title %}Agent Hub{% endblock %}</h1>
    <span class="topbar-spacer"></span>
    {% block page_actions %}{% endblock %}
  </nav>
  {% endblock %}
  {% block content %}{% endblock %}
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/static/hub.js?v={{ static_v() }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
